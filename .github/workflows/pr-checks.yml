# Home Assistant Operating System pull-request checks

name: PR checks

on: [pull_request]

jobs:
  linters:
    runs-on: ubuntu-22.04
    steps:
    - name: Install additional dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install \
          python3-flake8

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true

    - name: Set up Go for GROL userspace
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.22.x'
        cache: false

    - name: Test GROL userspace services
      run: |
        for module in grol/services/*/go.mod; do
          [ -f "$module" ] || continue
          service="${module%/go.mod}"
          echo "::group::go test $service"
          (cd "$service" && go test ./...)
          echo "::endgroup::"
        done

    - name: Check Dockerfile
      uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
      with:
        dockerfile: Dockerfile

    - name: Check shell scripts
      uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
      with:
        ignore_paths: buildroot

    - name: Check buildroot-external packages
      run: |
        buildroot/utils/check-package --exclude PackageHeader --exclude Upstream --br2-external buildroot-external/package/*/*
